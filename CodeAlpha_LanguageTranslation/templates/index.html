<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translation Tool</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 780px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 32px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    color: #1e293b;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: #64748b;
    font-size: 14px;
  }
  .lang-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  select {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    background: #f8fafc;
  }
  #swap-btn {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #swap-btn:hover { background: #4338ca; }
  .text-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .text-box {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  textarea {
    width: 100%;
    height: 160px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
    resize: vertical;
    font-family: inherit;
  }
  textarea#output-text {
    background: #f1f5f9;
  }
  .box-label {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 4px;
    display: block;
  }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button#translate-btn {
    background: #06b6d4;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button#translate-btn:hover { background: #0891b2; }
  button#translate-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  #copy-btn, #speak-btn {
    background: transparent;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  #copy-btn:hover, #speak-btn:hover { background: #f1f5f9; }
  #status {
    font-size: 13px;
    color: #ef4444;
    margin-top: 8px;
    min-height: 18px;
  }
  .output-tools {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🌐 Language Translation Tool</h1>
    <p class="subtitle">Enter text, choose your languages, and translate instantly.</p>

    <div class="lang-row">
      <select id="source-lang">
        <option value="auto">Detect Language</option>
        {% for name, code in languages %}
          <option value="{{ code }}">{{ name.title() }}</option>
        {% endfor %}
      </select>

      <button id="swap-btn" title="Swap languages">⇄</button>

      <select id="target-lang">
        {% for name, code in languages %}
          <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name.title() }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="text-row">
      <div class="text-box">
        <span class="box-label">Original text</span>
        <textarea id="input-text" placeholder="Type or paste text here..."></textarea>
      </div>
      <div class="text-box">
        <span class="box-label">Translation</span>
        <textarea id="output-text" placeholder="Translation will appear here..." readonly></textarea>
        <div class="output-tools">
          <button id="copy-btn" title="Copy translation">📋 Copy</button>
          <button id="speak-btn" title="Listen to translation">🔊 Speak</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="translate-btn">Translate</button>
    </div>
    <div id="status"></div>
  </div>

<script>
const inputText = document.getElementById('input-text');
const outputText = document.getElementById('output-text');
const sourceLang = document.getElementById('source-lang');
const targetLang = document.getElementById('target-lang');
const translateBtn = document.getElementById('translate-btn');
const swapBtn = document.getElementById('swap-btn');
const copyBtn = document.getElementById('copy-btn');
const speakBtn = document.getElementById('speak-btn');
const status = document.getElementById('status');

async function translateText() {
  const text = inputText.value.trim();
  status.textContent = '';
  if (!text) {
    status.textContent = 'Please enter some text to translate.';
    return;
  }
  translateBtn.disabled = true;
  translateBtn.textContent = 'Translating...';
  try {
    const res = await fetch('/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        source: sourceLang.value,
        target: targetLang.value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      status.textContent = data.error || 'Something went wrong.';
      outputText.value = '';
    } else {
      outputText.value = data.translated_text;
    }
  } catch (err) {
    status.textContent = 'Network error: could not reach the server.';
  } finally {
    translateBtn.disabled = false;
    translateBtn.textContent = 'Translate';
  }
}

translateBtn.addEventListener('click', translateText);

inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    translateText();
  }
});

swapBtn.addEventListener('click', () => {
  if (sourceLang.value === 'auto') {
    status.textContent = "Can't swap while source is set to 'Detect Language'.";
    return;
  }
  const tmp = sourceLang.value;
  sourceLang.value = targetLang.value;
  targetLang.value = tmp;
  inputText.value = outputText.value;
  outputText.value = '';
});

copyBtn.addEventListener('click', () => {
  if (!outputText.value) return;
  navigator.clipboard.writeText(outputText.value);
  copyBtn.textContent = '✅ Copied';
  setTimeout(() => (copyBtn.textContent = '📋 Copy'), 1500);
});

speakBtn.addEventListener('click', () => {
  if (!outputText.value) return;
  const utterance = new SpeechSynthesisUtterance(outputText.value);
  utterance.lang = targetLang.value;
  speechSynthesis.speak(utterance);
});
</script>
</body>
</html>
